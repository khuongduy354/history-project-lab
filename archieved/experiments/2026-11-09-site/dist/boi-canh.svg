<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 335" role="img" aria-labelledby="t d"><title id="t">Điện Biên Phủ và sở chỉ huy Huổi He</title><desc id="d">Sơ đồ khái quát vùng Tây Bắc. Bên trái là hướng sang Lào. Quân Pháp đóng ở Mường Thanh trong lòng chảo. Sở chỉ huy Việt Minh ở Huổi He, bên ngoài lòng chảo về phía đông bắc.</desc>
